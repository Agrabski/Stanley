# Builds, tests and releases for Stanley. Branches: feature PRs go into
# `develop`; `develop` is merged into `main` to release.
#
# - pull_request to develop/main: build + test, plus a notice saying which
#   issues the PR closes and how that bumps the next version.
# - nightly (schedule, at most once a day; or workflow_dispatch): if `develop`
#   changed since the last nightly, build + test + publish it and replace the
#   rolling "nightly" pre-release. A manual run always builds.
# - push to main: build + test, and keep the draft release "vX.Y.Z" up to date
#   (version and notes from the issues closed by the PRs main now contains, see
#   .github/scripts/release-notes.js).
# - release published (someone pressed Publish on the draft, creating the vX.Y.Z
#   tag): build + test that tag, attach the builds, merge the tag back into
#   develop (so develop's nightlies version after it).
# The binaries' version comes from MinVer (git tags), see Stanley.App.csproj.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [develop, main]
  release:
    types: [published]
  schedule:
    - cron: "0 2 * * *" # 02:00 UTC daily
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Supersede in-flight runs for the same PR; never cancel main/dispatch runs.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  AVALONIA_TELEMETRY_OPTOUT: "1"
  # global.json only selects the test runner (no sdk.version), so pin the SDK here.
  DOTNET_VERSION: "10.0.x"

jobs:
  # Nightly only: which develop commit to build, and whether it's new.
  nightly-gate:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.gate.outputs.sha }}
      build: ${{ steps.gate.outputs.build }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - id: gate
        shell: bash
        run: |
          set -euo pipefail
          sha=$(gh api "repos/$GH_REPO/commits/develop" --jq .sha)
          last=$(gh api "repos/$GH_REPO/git/ref/tags/nightly" --jq .object.sha 2>/dev/null || echo none)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || [ "$sha" != "$last" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "Building develop at $sha (last nightly: $last)."
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "::notice::develop hasn't changed since the last nightly ($sha); skipping."
          fi

  # Keeps one draft release up to date; publishing it (by hand) makes the release.
  release-draft:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
      issues: read
    concurrency:
      group: release-draft
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
      - uses: actions/github-script@v9
        with:
          script: |
            const { draftRelease } = require('./.github/scripts/release-notes.js');
            await draftRelease({ github, context, core });

  release-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
      - uses: actions/github-script@v9
        with:
          script: |
            const { checkPullRequest } = require('./.github/scripts/release-notes.js');
            await checkPullRequest({ github, context, core });

  build-and-test:
    needs: nightly-gate
    # nightly-gate only runs for nightlies; otherwise it's skipped and we build anyway.
    # A published release that isn't a vX.Y.Z tag (e.g. nightly) needs no build.
    if: >-
      ${{ !cancelled() && needs.nightly-gate.result != 'failure'
      && (needs.nightly-gate.result == 'skipped' || needs.nightly-gate.outputs.build == 'true')
      && (github.event_name != 'release' || (startsWith(github.ref_name, 'v') && !github.event.release.prerelease)) }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      # Full history + tags: MinVer derives the version from the latest vX.Y.Z tag.
      # Nightlies build develop's commit; everything else the triggering ref.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.nightly-gate.outputs.sha }}

      - id: sha
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # No packages.lock.json in the repo, so cache on the project files.
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Build.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build
        run: dotnet build Stanley.slnx -c Release

      # Only used for file names and release titles; the binaries get the same
      # version from MinVer during their own build.
      - name: Version
        id: version
        shell: bash
        run: |
          version=$(dotnet msbuild src/Stanley.App -t:MinVer -getProperty:MinVerVersion)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

      - name: Test
        shell: bash
        run: |
          set -euo pipefail
          for proj in \
            tests/Stanley.App.HeadlessTests/Stanley.App.HeadlessTests.csproj \
            tests/Stanley.App.Tests/Stanley.App.Tests.csproj \
            tests/Stanley.Editing.Tests/Stanley.Editing.Tests.csproj \
            tests/Stanley.EditorFramework.Tests/Stanley.EditorFramework.Tests.csproj \
            tests/Stanley.Editors.Tests/Stanley.Editors.Tests.csproj \
            tests/Stanley.ProjectModel.Tests/Stanley.ProjectModel.Tests.csproj \
            tests/Stanley.Rendering.Tests/Stanley.Rendering.Tests.csproj
          do
            echo "::group::$proj"
            dotnet test --project "$proj" -c Release --no-build
            echo "::endgroup::"
          done

  # Only nightlies and releases ship builds; PRs and pushes to main just test.
  publish:
    needs: build-and-test
    if: ${{ !cancelled() && needs.build-and-test.result == 'success' && contains(fromJSON('["schedule","workflow_dispatch","release"]'), github.event_name) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            os: ubuntu-latest
          - rid: win-x64
            os: windows-latest
          - rid: osx-arm64
            os: macos-latest
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.build-and-test.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.build-and-test.outputs.sha }}

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ matrix.rid }}-${{ hashFiles('**/*.csproj', '**/Directory.Build.props', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ matrix.rid }}-
            nuget-${{ runner.os }}-

      - name: Publish
        shell: bash
        run: >
          dotnet publish src/Stanley.App -c Release -r ${{ matrix.rid }} --self-contained
          -o "out/stanley-$VERSION-${{ matrix.rid }}"

      - name: Smoke test (CLI)
        shell: bash
        run: |
          exe="out/stanley-$VERSION-${{ matrix.rid }}/stanley"
          [ -f "$exe.exe" ] && exe="$exe.exe"
          "$exe" --version
          "$exe" --help

      - name: Archive (tar.gz)
        if: runner.os != 'Windows'
        shell: bash
        # tar keeps the executable bit; the artifact zip around it doesn't matter.
        run: tar -czf "stanley-$VERSION-${{ matrix.rid }}.tar.gz" -C out "stanley-$VERSION-${{ matrix.rid }}"

      - name: Archive (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "out/stanley-$env:VERSION-${{ matrix.rid }}" -DestinationPath "stanley-$env:VERSION-${{ matrix.rid }}.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: stanley-${{ matrix.rid }}
          path: stanley-${{ env.VERSION }}-${{ matrix.rid }}.*
          if-no-files-found: error
          retention-days: 30
          # Already compressed.
          compression-level: 0

  # A release was just published from the draft: attach the builds to it.
  release-assets:
    needs: [build-and-test, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' && github.event_name == 'release' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: stanley-*
          merge-multiple: true

      - name: Attach builds to the release
        run: gh release upload "$TAG" dist/* --clobber

      # So develop contains the tag and its nightlies version after this release
      # (MinVer only sees tags on ancestors). Fails softly if develop is protected
      # or conflicts - then merge main into develop by hand.
      - name: Merge the release back into develop
        shell: bash
        run: |
          gh api "repos/$GH_REPO/merges" -f base=develop -f head="$TAG" \
            -f commit_message="Merge $TAG back into develop" \
            || echo "::warning::Couldn't merge $TAG into develop automatically; merge main into develop by hand."

  nightly-release:
    needs: [build-and-test, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: nightly-release
      cancel-in-progress: false
    env:
      VERSION: ${{ needs.build-and-test.outputs.version }}
      SHA: ${{ needs.build-and-test.outputs.sha }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: stanley-*
          merge-multiple: true

      - name: Replace the rolling nightly pre-release
        shell: bash
        run: |
          set -euo pipefail
          ls -la dist
          gh release delete nightly --cleanup-tag --yes || echo "No previous nightly release."
          # Deleting via the API can leave the tag briefly; make sure it's gone.
          gh api -X DELETE "repos/$GH_REPO/git/refs/tags/nightly" 2>/dev/null || true
          notes="Automated build of \`develop\`, not a stable release.

          - Version: \`$VERSION\`
          - Commit: $GITHUB_SERVER_URL/$GH_REPO/commit/$SHA
          - Built: $(date -u +'%Y-%m-%d %H:%M UTC')"
          gh release create nightly dist/* \
            --target "$SHA" \
            --prerelease \
            --title "Nightly $VERSION" \
            --notes "$notes"
