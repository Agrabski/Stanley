# Builds, tests and releases for Stanley.
#
# - pull_request to main: build + test, plus a notice saying which issues the PR
#   closes and how that bumps the next version.
# - push to main: keep the draft release "vX.Y.Z" up to date (version and notes
#   from the issues closed by PRs merged since the last release, see
#   .github/scripts/release-notes.js); build + test; publish self-contained
#   builds for each platform (workflow artifacts, 30 days); replace the rolling
#   "nightly" pre-release.
# - release published (someone pressed Publish on the draft, creating the vX.Y.Z
#   tag): build + test that tag and attach the builds to the release.
# - workflow_dispatch: build + test + publish + nightly.
# The binaries' version comes from MinVer (git tags), see Stanley.App.csproj.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Supersede in-flight runs for the same PR; never cancel main/dispatch runs.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  AVALONIA_TELEMETRY_OPTOUT: "1"
  # global.json only selects the test runner (no sdk.version), so pin the SDK here.
  DOTNET_VERSION: "10.0.x"

jobs:
  # Keeps one draft release up to date; publishing it (by hand) makes the release.
  release-draft:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
      issues: read
    concurrency:
      group: release-draft
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
      - uses: actions/github-script@v9
        with:
          script: |
            const { draftRelease } = require('./.github/scripts/release-notes.js');
            await draftRelease({ github, context, core });

  release-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
      - uses: actions/github-script@v9
        with:
          script: |
            const { checkPullRequest } = require('./.github/scripts/release-notes.js');
            await checkPullRequest({ github, context, core });

  build-and-test:
    # A published release that isn't a vX.Y.Z tag (e.g. nightly) needs no build.
    if: github.event_name != 'release' || (startsWith(github.ref_name, 'v') && !github.event.release.prerelease)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # Full history + tags: MinVer derives the version from the latest vX.Y.Z tag.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # No packages.lock.json in the repo, so cache on the project files.
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Build.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build
        run: dotnet build Stanley.slnx -c Release

      # Only used for file names and release titles; the binaries get the same
      # version from MinVer during their own build.
      - name: Version
        id: version
        shell: bash
        run: |
          version=$(dotnet msbuild src/Stanley.App -t:MinVer -getProperty:MinVerVersion)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

      - name: Test
        shell: bash
        run: |
          set -euo pipefail
          for proj in \
            tests/Stanley.App.HeadlessTests/Stanley.App.HeadlessTests.csproj \
            tests/Stanley.App.Tests/Stanley.App.Tests.csproj \
            tests/Stanley.Editing.Tests/Stanley.Editing.Tests.csproj \
            tests/Stanley.EditorFramework.Tests/Stanley.EditorFramework.Tests.csproj \
            tests/Stanley.Editors.Tests/Stanley.Editors.Tests.csproj \
            tests/Stanley.ProjectModel.Tests/Stanley.ProjectModel.Tests.csproj \
            tests/Stanley.Rendering.Tests/Stanley.Rendering.Tests.csproj
          do
            echo "::group::$proj"
            dotnet test --project "$proj" -c Release --no-build
            echo "::endgroup::"
          done

  publish:
    needs: build-and-test
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            os: ubuntu-latest
          - rid: win-x64
            os: windows-latest
          - rid: osx-arm64
            os: macos-latest
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.build-and-test.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ matrix.rid }}-${{ hashFiles('**/*.csproj', '**/Directory.Build.props', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ matrix.rid }}-
            nuget-${{ runner.os }}-

      - name: Publish
        shell: bash
        run: >
          dotnet publish src/Stanley.App -c Release -r ${{ matrix.rid }} --self-contained
          -o "out/stanley-$VERSION-${{ matrix.rid }}"

      - name: Smoke test (CLI)
        shell: bash
        run: |
          exe="out/stanley-$VERSION-${{ matrix.rid }}/stanley"
          [ -f "$exe.exe" ] && exe="$exe.exe"
          "$exe" --version
          "$exe" --help

      - name: Archive (tar.gz)
        if: runner.os != 'Windows'
        shell: bash
        # tar keeps the executable bit; the artifact zip around it doesn't matter.
        run: tar -czf "stanley-$VERSION-${{ matrix.rid }}.tar.gz" -C out "stanley-$VERSION-${{ matrix.rid }}"

      - name: Archive (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "out/stanley-$env:VERSION-${{ matrix.rid }}" -DestinationPath "stanley-$env:VERSION-${{ matrix.rid }}.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: stanley-${{ matrix.rid }}
          path: stanley-${{ env.VERSION }}-${{ matrix.rid }}.*
          if-no-files-found: error
          retention-days: 30
          # Already compressed.
          compression-level: 0

  # A release was just published from the draft: attach the builds to it.
  release-assets:
    needs: [build-and-test, publish]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: stanley-*
          merge-multiple: true

      - name: Attach builds to the release
        run: gh release upload "$TAG" dist/* --clobber

  nightly-release:
    needs: [build-and-test, publish]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: nightly-release
      cancel-in-progress: false
    env:
      VERSION: ${{ needs.build-and-test.outputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: stanley-*
          merge-multiple: true

      - name: Replace the rolling nightly pre-release
        shell: bash
        run: |
          set -euo pipefail
          ls -la dist
          gh release delete nightly --cleanup-tag --yes || echo "No previous nightly release."
          # Deleting via the API can leave the tag briefly; make sure it's gone.
          gh api -X DELETE "repos/$GH_REPO/git/refs/tags/nightly" 2>/dev/null || true
          notes="Automated build of \`main\`, not a stable release.

          - Version: \`$VERSION\`
          - Commit: $GITHUB_SERVER_URL/$GH_REPO/commit/$GITHUB_SHA
          - Built: $(date -u +'%Y-%m-%d %H:%M UTC')"
          gh release create nightly dist/* \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Nightly $VERSION" \
            --notes "$notes"
